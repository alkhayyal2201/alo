<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alo Marassi Bahrain — Leave Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <h1>Alo Marassi Bahrain</h1>
      <p class="auth-sub">Leave Management Portal</p>
      <button id="login-btn" class="btn-primary" data-netlify-identity-button="login">Sign in</button>
      <button id="signup-btn" class="btn-secondary" data-netlify-identity-button="signup">Create account</button>
      <p class="auth-footer">Secured by Netlify Identity</p>
    </div>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="brand-text">
          <strong>Alo Marassi Bahrain</strong>
          <span>LEAVE MANAGEMENT</span>
        </div>
        <span class="year-badge">2026</span>
      </div>
      <div class="user-area">
        <span class="user-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
          <span id="user-name">—</span>
        </span>
        <span id="user-role" class="role-badge"></span>
        <button id="logout-btn" class="icon-btn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="calendar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
      <button class="tab" data-tab="overview">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Overview
      </button>
      <button class="tab" data-tab="my-leaves">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        My Leaves
      </button>
      <button class="tab" data-tab="approvals">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
        Approvals
        <span id="approval-badge" class="tab-badge hidden">0</span>
      </button>
    </nav>

    <!-- KPIs (shared across tabs) -->
    <section class="kpis">
      <div class="kpi">
        <div class="kpi-icon kpi-pending">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <span class="kpi-badge kpi-badge-pending" data-kpi="pending">0</span>
        <div class="kpi-value" data-kpi-value="pending">0</div>
        <div class="kpi-label">Pending</div>
      </div>
      <div class="kpi">
        <div class="kpi-icon kpi-approved">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="kpi-badge kpi-badge-approved" data-kpi="approved">0</span>
        <div class="kpi-value" data-kpi-value="approved">0</div>
        <div class="kpi-label">Approved</div>
      </div>
      <div class="kpi">
        <div class="kpi-icon kpi-rejected">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <div class="kpi-value" data-kpi-value="rejected">0</div>
        <div class="kpi-label">Rejected</div>
      </div>
    </section>

    <!-- Tab: Calendar -->
    <section id="tab-calendar" class="tab-content">
      <div class="cal-container">
        <div class="cal-nav">
          <button id="cal-prev" class="cal-nav-btn" title="Previous month">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <h2 id="cal-month-label" class="cal-month-label"></h2>
          <button id="cal-today-btn" class="btn-sm btn-outline">Today</button>
          <button id="cal-next" class="cal-nav-btn" title="Next month">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="cal-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
      </div>
    </section>

    <!-- Tab: Overview (year grid) -->
    <section id="tab-overview" class="tab-content hidden">
      <section class="filterbar">
        <div class="filter-left">
          <span class="filter-label">FILTER:</span>
          <select id="status-filter">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="dot dot-pending"></span>Pending</span>
          <span class="legend-item"><span class="dot dot-approved"></span>Approved</span>
          <span class="legend-item"><span class="dot dot-rejected"></span>Rejected</span>
          <span class="legend-item"><span class="dot dot-reschedule"></span>Reschedule</span>
          <button id="reset-btn" class="reset-btn">&#8635; Reset</button>
        </div>
      </section>
      <section class="grid-wrap">
        <table class="leave-grid">
          <thead>
            <tr>
              <th class="col-name">NAME</th>
              <th>JAN</th><th>FEB</th><th>MAR</th><th>APR</th>
              <th>MAY</th><th>JUN</th><th>JUL</th><th>AUG</th>
              <th>SEP</th><th>OCT</th><th>NOV</th><th>DEC</th>
            </tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </section>
    </section>

    <!-- Tab: My Leaves -->
    <section id="tab-my-leaves" class="tab-content hidden">
      <div id="my-leaves-list" class="card-grid"></div>
    </section>

    <!-- Tab: Approvals -->
    <section id="tab-approvals" class="tab-content hidden">
      <div id="approvals-list" class="card-grid"></div>
    </section>
  </main>

  <!-- Leave Request Modal -->
  <div id="leave-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Request Leave</h3>
      <p id="leave-modal-month" class="modal-month"></p>
      <label>Start date<input type="date" id="leave-start" /></label>
      <label>End date<input type="date" id="leave-end" /></label>
      <label>Notes<textarea id="leave-notes" rows="3" placeholder="Optional"></textarea></label>
      <div class="modal-actions">
        <button id="leave-cancel" class="btn-secondary">Cancel</button>
        <button id="leave-submit" class="btn-primary">Submit</button>
      </div>
    </div>
  </div>

  <!-- Day Detail Modal -->
  <div id="day-modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="day-modal-title"></h3>
      <div id="day-modal-body" class="day-detail-body"></div>
      <div class="modal-actions" style="margin-top:16px;">
        <button id="day-modal-close" class="btn-secondary" style="flex:1;">Close</button>
        <button id="day-modal-request" class="btn-primary" style="flex:1;">Request Leave</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
