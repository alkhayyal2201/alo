<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alo Marassi Bahrain — Leave Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <main id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="brand-text">
          <strong>Alo Marassi Bahrain</strong>
          <span id="current-month-display">January 2026</span>
        </div>
      </div>

      <div class="user-area">
        <div id="manager-info" class="hidden">
          <span class="user-label">Manager:</span>
          <div class="user-pill"><span id="user-name">Admin</span></div>
        </div>
        <button id="login-btn" class="btn-primary auth-btn">Manager Sign-in</button>
        <button id="logout-btn" class="icon-btn hidden" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <div class="calendar-container">
      <div class="calendar-header-days">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="calendar-grid" class="calendar-grid">
        </div>
    </div>
  </main>

  <div id="leave-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Request Leave</h3>
      <p id="selected-date-label" class="modal-sub"></p>
      <input type="hidden" id="submit-day">
      
      <label for="request-name">Employee Name</label>
      <select id="request-name">
        <option value="">Select your name...</option>
        <option value="Amen">Amen</option>
        <option value="Ousama">Ousama</option>
        <option value="Ali">Ali</option>
        <option value="Hardeep">Hardeep</option>
        <option value="Ariel">Ariel</option>
        <option value="Jojo">Jojo</option>
        <option value="Maryam">Maryam</option>
        <option value="Brenda">Brenda</option>
        <option value="Rhea">Rhea</option>
        <option value="Najwa">Najwa</option>
        <option value="Roaa">Roaa</option>
        <option value="Mochi">Mochi</option>
        <option value="Arth">Arth</option>
        <option value="Isa">Isa</option>
      </select>

      <div class="modal-actions">
        <button id="leave-cancel" class="btn-secondary">Cancel</button>
        <button id="leave-submit" class="btn-primary">Submit Request</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
